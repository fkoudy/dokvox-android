name: 2 – Sestavit aplikaci
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rozbalit nahraný ZIP
        run: |
          Z=$(ls -1 *.zip 2>/dev/null | head -1 || true)
          if [ -n "$Z" ]; then
            echo "Rozbaluji $Z"; rm -rf /tmp/z && mkdir -p /tmp/z && unzip -q -o "$Z" -d /tmp/z
            SRC=/tmp/z; [ -d /tmp/z/dokvox-android ] && SRC=/tmp/z/dokvox-android
            cp -r "$SRC"/. .
          fi
          test -f web/index.html || { echo "::error::Chybí web/index.html – nahrajte DOKVOX_…_ANDROID.zip"; exit 1; }
          test -f klic/dokvox-upload.jks || { echo "::error::Chybí podpisový klíč – nejdřív spusťte akci 1."; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - name: Příprava projektu
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          node priprava.js www
          [ -d android ] || npx cap add android
          npx cap sync android
          node priprava.js android
      - name: Sestavení
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleDebug
      - name: Podepsání
        env:
          P: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p vystup
          cp android/app/build/outputs/bundle/release/app-release.aab vystup/dokvox.aab
          jarsigner -keystore klic/dokvox-upload.jks -storepass "$P" -keypass "$P" -sigalg SHA256withRSA -digestalg SHA-256 vystup/dokvox.aab upload
          cp android/app/build/outputs/apk/debug/app-debug.apk vystup/dokvox-test.apk
          ls -la vystup
      - uses: actions/upload-artifact@v4
        with:
          name: dokvox-pro-google-play
          path: vystup/dokvox.aab
      - uses: actions/upload-artifact@v4
        with:
          name: dokvox-test-do-telefonu
          path: vystup/dokvox-test.apk
